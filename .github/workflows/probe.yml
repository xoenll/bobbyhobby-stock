name: Probe gallery
on:
  push:
    branches: [probe-gallery]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" https://playriftbound.com/en-us/card-gallery/ -o g.html
          ls -la g.html
          grep -o '<script[^>]*id="__NEXT_DATA__"' g.html | head -2 || true
          grep -o 'RAD-133[a-z*]*' g.html | sort | uniq -c | head
          python3 - <<'PY'
          import re
          h=open('g.html',encoding='utf-8',errors='replace').read()
          for m in list(re.finditer(r'RAD-133a', h))[:2]:
              print('CTX>>', h[max(0,m.start()-1500):m.start()+800].replace('\\n',' '))
          print('SCRIPTS', re.findall(r'<script[^>]+src="([^"]+)"', h)[:15])
          print('JSONURLS', sorted(set(re.findall(r'https?://[^"\'\\s]+\.json', h)))[:20])
          print('CMS', len(re.findall('cmsassets.rgpub.io', h)))
          PY
