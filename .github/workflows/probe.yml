name: Probe gallery
on:
  push:
    branches: [probe-gallery]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: |
          python3 -I sync/images.py --repo "$GITHUB_WORKSPACE"
          python3 -I sync/images.py --repo "$GITHUB_WORKSPACE" --dry-run
          grep -o '"rad-133a":\[[0-9,]*\]' index.html
          python3 -c "
          from PIL import Image;im=Image.open('sprites/s24.webp');c=im.crop((3*260,2*363,4*260,3*363));print('cell mean',sum(c.convert('L').getdata())/(260*363))"
